[package]
name = "bitcoind-client"
version = "1.0.0"
authors = ["ValuedMammal <valuedmammal@protonmail.com>"]
description = "Bitcoin Core RPC client library"
keywords = ["bitcoin"]
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/bitcoind-client"
repository = "https://github.com/valuedmammal/rust-bitcoind-client"
rust-version = "1.85.0"
edition = "2024"

[package.metadata.docs.rs]
features = ["simple-http"]

[dependencies]
corepc-types = { version = "0.15.0", default-features = false }
jsonrpc = { version = "0.20.1", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
anyhow = "1"
# Check types deserialization by denying unknown fields
corepc-types = { version = "0.15.0", default-features = false, features = ["serde-deny-unknown-fields"] }
bitcoind = { version = "0.41.0", features = ["download", "latest"] }
# Enable crate default features + HTTP client for tests, examples.
bitcoind-client = { path = ".", default-features = true, features = ["simple-http"] }

[[example]]
name = "client"

[features]
# Enable std library
std = ["corepc-types/std"]

# Native HTTP client
simple-http = ["std", "jsonrpc/simple_http"]

# Bitcoin Core compatible versions
default = ["31_0"]
31_0 = ["30_0"]
30_0 = ["29_0"]
29_0 = []
